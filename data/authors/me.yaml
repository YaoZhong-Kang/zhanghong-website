bio: Kilar Zhang，主要从事高能物理理论研究，关注超弦理论、数学物理与引力波。研究结合基础引力理论与引力波观测，涉及规范场论与共形场论对偶、量子代数与可积性，以及致密天体和暗物质模型。2021年3月加入上海大学。
