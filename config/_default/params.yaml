    pack: default
    colors:
      primary: blue
      secondary: teal
      neutral: slate
  typography:
    pack: academic
  layout:
    radius: lg
    spacing: comfortable
    avatar_shape: rounded
  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
  footer:
    style: minimal
    language_switcher: false
    text: 资料与照片来源：<a href="https://physics.shu.edu.cn/info/1082/1559.htm">上海大学物理系</a>（2022年9月）与
      <a href="https://scicol.shu.edu.cn/szdw/faculty/zh.htm">理学院</a>（2021年6月）。
  copyright:
    notice: © {year} 张弘
  seo:
    title: 张弘 | 上海大学
    ai:
      allow:
      - /
      disallow: []
      note: 张弘老师的个人学术主页。资料来源与更新时间见各页面。
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: apa
  search:
    enable: true
